name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable
      - name: Integration tests in VS Code
        run: xvfb-run -a bun run test:e2e

  e2e-datastar:
    # Installs the Datastar extension from the Marketplace, which can be flaky in CI.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable
      - name: Integration tests with the Datastar extension installed
        run: xvfb-run -a bun run test:e2e:datastar
