name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json version v$version does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - run: bun run check
      - run: bun run package
      - name: Publish to the Visual Studio Marketplace
        run: bunx @vscode/vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" *.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
