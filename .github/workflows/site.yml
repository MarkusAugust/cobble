name: Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/screenshot.png"
      - "docs/demo.gif"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/screenshot.png"
      - "docs/demo.gif"
      - ".github/workflows/site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run sjekk
